; EcoFlow River 2 Pro BLE monitor for the ESP32-2432S028R "Cheap Yellow Display"
[env:cyd]
; pinned: the code targets Arduino core 2.0.x (mbedTLS / watchdog APIs)
platform = espressif32@~7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    ; TFT_eSPI is configured entirely from include/User_Setup.h (CYD pin map)
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    ; micro-ecc: only need SECP160r1, shrink the rest out
    -DuECC_SUPPORTS_secp160r1=1
    -DuECC_SUPPORTS_secp192r1=0
    -DuECC_SUPPORTS_secp224r1=0
    -DuECC_SUPPORTS_secp256r1=0
    -DuECC_SUPPORTS_secp256k1=0
    -DuECC_SUPPORT_COMPRESSED_POINT=0
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bodmer/TFT_eSPI@^2.5.43
    ; registry copy has no semver tags — pin the upstream git tag instead
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; Same firmware for the CYD variant with TWO USB ports (USB-C + micro-USB),
; which has a different display panel — see include/User_Setup.h
[env:cyd2usb]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DCYD_2USB=1

; Host-side protocol tests (no hardware needed): pio test -e native
[env:native]
platform = native
build_flags =
    -std=c++17
test_build_src = no
